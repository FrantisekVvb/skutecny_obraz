<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hledání skutečného obrazu</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0ea5e9;
      --ok: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;

      --canvas-bg: #eef2ff;
      --canvas-border: #c7d2fe;

      --axis: #334155;
      --tick: #64748b;
      --ray: #0ea5e9;
      --ray2: #a78bfa;
      --lens: #2563eb;
      --screen: #0f172a;

      --candle-body: #ef4444;
      --candle-wax: #fb7185;
      --flame: #f59e0b;
      --flame2: #fde047;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --panel: #0f172a;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #22c55e;
        --warn: #f59e0b;
        --bad: #fb7185;

        --canvas-bg: #0b1020;
        --canvas-border: #1f2a44;

        --axis: #94a3b8;
        --tick: #94a3b8;
        --ray: #38bdf8;
        --ray2: #c4b5fd;
        --lens: #60a5fa;
        --screen: #e5e7eb;

        --candle-body: #fb7185;
        --candle-wax: #fecdd3;
        --flame: #fbbf24;
        --flame2: #fde68a;
      }
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .app {
      width: min(1600px, 100%);
      background: var(--panel);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: grid;
      gap: 14px;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    .hint { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.45; }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: var(--canvas-bg);
      border: 1px solid var(--canvas-border);
      touch-action: none;
    }
    .sceneWrap {
      position: relative;
    }
    .lensToggle {
      position: absolute;
      z-index: 3;
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(15,23,42,0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
    }
    .lensToggle button {
      appearance: none;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(15,23,42,0.25);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: transform 120ms ease, background-color 120ms ease, opacity 120ms ease;
    }
    .lensToggle button:hover { transform: translateY(-1px); }
    .lensToggle button[aria-pressed="true"] {
      background: color-mix(in oklab, var(--accent) 24%, rgba(15,23,42,0.22) 76%);
      border-color: color-mix(in oklab, var(--accent) 35%, rgba(148,163,184,0.25) 65%);
    }
    .card {
      background: color-mix(in oklab, var(--panel) 92%, var(--text) 8%);
      border-radius: 10px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .uiToggle {
      position: absolute;
      z-index: 3;
      left: 14px;
      top: 14px;
      display: inline-flex;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(15,23,42,0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
    }
    .uiToggle button {
      appearance: none;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(15,23,42,0.25);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: transform 120ms ease, background-color 120ms ease, opacity 120ms ease;
      white-space: nowrap;
    }
    .uiToggle button:hover { transform: translateY(-1px); }
    .uiToggle button[aria-pressed="true"] {
      background: color-mix(in oklab, var(--accent) 24%, rgba(15,23,42,0.22) 76%);
      border-color: color-mix(in oklab, var(--accent) 35%, rgba(148,163,184,0.25) 65%);
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Hledání skutečného obrazu</h1>
    <p class="hint">
      Táhni <strong>plamínek</strong> (vlevo) a <strong>stínítko</strong> (svislá černá čára) po optické ose.
      Vedle stínítka se zobrazuje, jaký obraz se na něm vytvoří. Pokud je stínítko mimo rovinu obrazu, obraz je rozmazaný.
    </p>

    <div class="card">
      <div class="sceneWrap">
        <canvas id="scene" width="1600" height="660" aria-label="Optická lavice se spojnou čočkou"></canvas>
        <div class="uiToggle" role="group" aria-label="Pomocné paprsky">
          <button id="helperRaysBtn" type="button" aria-pressed="false">Pomocné paprsky</button>
        </div>
        <div id="lensToggle" class="lensToggle" role="group" aria-label="Typ čočky">
          <button id="convergingBtn" type="button" aria-pressed="true">Spojka</button>
          <button id="divergingBtn" type="button" aria-pressed="false">Rozptylka</button>
          <button id="noLensBtn" type="button" aria-pressed="false">Bez čočky</button>
          <button id="cameraBtn" type="button" aria-pressed="false">Camera obscura</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const lensToggleEl = document.getElementById("lensToggle");
    const convergingBtn = document.getElementById("convergingBtn");
    const divergingBtn = document.getElementById("divergingBtn");
    const noLensBtn = document.getElementById("noLensBtn");
    const cameraBtn = document.getElementById("cameraBtn");
    const helperRaysBtn = document.getElementById("helperRaysBtn");

    function cssVar(name, fallback) {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    }

    function roundRectPath(context, x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, Math.min(w, h) / 2));
      if (typeof context.roundRect === "function") {
        context.roundRect(x, y, w, h, radius);
        return;
      }
      context.moveTo(x + radius, y);
      context.arcTo(x + w, y, x + w, y + h, radius);
      context.arcTo(x + w, y + h, x, y + h, radius);
      context.arcTo(x, y + h, x, y, radius);
      context.arcTo(x, y, x + w, y, radius);
      context.closePath();
    }

    const state = {
      // pixel coordinates on canvas
      lensX: Math.round(canvas.width * 0.48),
      axisY: 360,
      candleBaseY: 440,
      candleX: 140,
      screenX: 900,
      screenY: 330,
      fPx: 110,
      lensType: "converging", // "converging" | "diverging" | "none" | "camera"
      candleHeight: 118,
      showHelperRays: false,
      dragging: null, // "candle" | "screen" | null
      dragOffsetX: 0,
      dragOffsetY: 0,
      hover: null
    };

    const limits = {
      candleMin: 40,
      screenMin: 520,
      screenMax: canvas.width - 40
    };

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function canvasPos(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
      };
    }

    // Lens formula: 1/f = 1/do + 1/di
    // do: object distance (positive to left of lens), di: image distance (positive to right for real images)
    function computeImage(doPx, fPx) {
      if (doPx <= 0 || fPx <= 0) return { type: "invalid" };
      if (Math.abs(doPx - fPx) < 1e-6) return { type: "at_f" };
      const inv = (1 / fPx) - (1 / doPx);
      if (Math.abs(inv) < 1e-9) return { type: "at_infinity" };
      const di = 1 / inv; // can be negative for virtual images
      const m = -di / doPx;
      return { type: di > 0 ? "real" : "virtual", di, m };
    }

    function effectiveF() {
      const f = Math.max(1, state.fPx);
      if (state.lensType === "none") return Number.POSITIVE_INFINITY;
      return state.lensType === "converging" ? f : -f;
    }

    function setLensType(type) {
      state.lensType = type === "camera"
        ? "camera"
        : (type === "none" ? "none" : (type === "diverging" ? "diverging" : "converging"));
      if (convergingBtn) convergingBtn.setAttribute("aria-pressed", String(state.lensType === "converging"));
      if (divergingBtn) divergingBtn.setAttribute("aria-pressed", String(state.lensType === "diverging"));
      if (noLensBtn) noLensBtn.setAttribute("aria-pressed", String(state.lensType === "none"));
      if (cameraBtn) cameraBtn.setAttribute("aria-pressed", String(state.lensType === "camera"));
      draw();
    }

    function positionLensToggle() {
      if (!lensToggleEl) return;
      const rect = canvas.getBoundingClientRect();
      const wrap = lensToggleEl.parentElement;
      if (!(wrap instanceof HTMLElement)) return;
      const scaleX = rect.width / canvas.width;
      const scaleY = rect.height / canvas.height;

      // Place the toggle just below the lens, regardless of canvas height.
      // Keep it safely inside the canvas bounds.
      const lensBottom = canvas.height - 70; // matches drawLens()
      const approxY = clamp(lensBottom + 44, 40, canvas.height - 24);
      const left = state.lensX * scaleX;
      const top = approxY * scaleY;
      lensToggleEl.style.left = `${left}px`;
      lensToggleEl.style.top = `${top}px`;
      lensToggleEl.style.transform = "translate(-50%, -50%)";
    }

    function drawAxis() {
      // intentionally left blank (no optical axis)
    }

    function drawMarks() {
      if (state.lensType === "none" || state.lensType === "camera") return;
      const x0 = state.lensX;
      const f = Math.abs(effectiveF());
      const marks = [
        { x: x0 - 2 * f, label: "2F" },
        { x: x0 - f, label: "F" },
        { x: x0 + f, label: "F" },
        { x: x0 + 2 * f, label: "2F" }
      ];

      ctx.save();
      ctx.strokeStyle = "rgba(148,163,184,0.78)";
      ctx.fillStyle = "rgba(226,232,240,0.92)";
      ctx.lineWidth = 2;
      ctx.font = "900 14px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      marks.forEach((m) => {
        if (m.x < 26 || m.x > canvas.width - 26) return;
        // small tick + label (without drawing the full axis)
        const y = state.axisY;
        ctx.beginPath();
        ctx.moveTo(m.x, y - 10);
        ctx.lineTo(m.x, y + 10);
        ctx.stroke();

        // label with subtle pill background for readability
        const labelY = y + 14;
        const padX = 8;
        const padY = 4;
        const w = ctx.measureText(m.label).width + padX * 2;
        const h = 20;
        ctx.save();
        ctx.fillStyle = "rgba(15,23,42,0.40)";
        ctx.strokeStyle = "rgba(148,163,184,0.30)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        roundRectPath(ctx, m.x - w / 2, labelY - padY, w, h, 999);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.35)";
        ctx.shadowBlur = 6;
        ctx.fillStyle = "rgba(226,232,240,0.94)";
        ctx.fillText(m.label, m.x, labelY);
        ctx.restore();
      });
      ctx.restore();
    }

    function drawLens() {
      if (state.lensType === "none") return;
      if (state.lensType === "camera") {
        // Pinhole camera: an opaque plate with a small hole.
        const x = state.lensX;
        const top = 76;
        const bottom = canvas.height - 70;
        ctx.save();
        ctx.fillStyle = "rgba(2, 6, 23, 0.55)";
        ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        roundRectPath(ctx, x - 10, top, 20, bottom - top, 10);
        ctx.fill();
        ctx.stroke();

        // hole at optical axis
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(x, state.axisY, 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = "rgba(226, 232, 240, 0.55)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(x, state.axisY, 3.2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        return;
      }
      const x = state.lensX;
      const top = 76;
      const bottom = canvas.height - 70;
      const w = 34;
      const mid = (top + bottom) / 2;

      const grad = ctx.createLinearGradient(x - w, 0, x + w, 0);
      grad.addColorStop(0, "rgba(37, 99, 235, 0.10)");
      grad.addColorStop(0.5, "rgba(37, 99, 235, 0.32)");
      grad.addColorStop(1, "rgba(37, 99, 235, 0.10)");

      ctx.save();
      ctx.fillStyle = grad;
      ctx.strokeStyle = cssVar("--lens", "#2563eb");
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (state.lensType === "diverging") {
        // "vykrojená" (rozptylka) – hourglass shape like in reference
        const wTop = w * 1.05;
        const wMid = w * 0.32;

        // left side from top -> mid -> bottom (concave inward at mid)
        ctx.moveTo(x - wTop, top);
        ctx.bezierCurveTo(
          x - wTop * 0.92, top + (mid - top) * 0.25,
          x - wMid * 1.05, mid - (mid - top) * 0.18,
          x - wMid, mid
        );
        ctx.bezierCurveTo(
          x - wMid * 1.05, mid + (bottom - mid) * 0.18,
          x - wTop * 0.92, bottom - (bottom - mid) * 0.25,
          x - wTop, bottom
        );

        // bottom edge to right side
        ctx.lineTo(x + wTop, bottom);

        // right side bottom -> mid -> top (mirror)
        ctx.bezierCurveTo(
          x + wTop * 0.92, bottom - (bottom - mid) * 0.25,
          x + wMid * 1.05, mid + (bottom - mid) * 0.18,
          x + wMid, mid
        );
        ctx.bezierCurveTo(
          x + wMid * 1.05, mid - (mid - top) * 0.18,
          x + wTop * 0.92, top + (mid - top) * 0.25,
          x + wTop, top
        );
        ctx.closePath();
      } else {
        // biconvex-ish shape
        ctx.moveTo(x, top);
        ctx.bezierCurveTo(x - w, top + 26, x - w, bottom - 26, x, bottom);
        ctx.bezierCurveTo(x + w, bottom - 26, x + w, top + 26, x, top);
        ctx.closePath();
      }
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // center point
      ctx.fillStyle = cssVar("--lens", "#2563eb");
      ctx.beginPath();
      ctx.arc(x, state.axisY, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function candleHitRect() {
      const x = state.candleX;
      const baseY = state.candleBaseY;
      const h = state.candleHeight;
      // Flame only: smaller hit box around the flame.
      return { x: x - 28, y: baseY - h - 14, w: 56, h: h + 22 };
    }

    function screenHitRect() {
      const x = state.screenX;
      const halfLen = 160;
      const top = state.screenY - halfLen;
      const bottom = state.screenY + halfLen;
      return { x: x - 16, y: top - 12, w: 32, h: (bottom - top) + 24 };
    }

    function drawFlame(x, baseY, height, opts = {}) {
      const inverted = Boolean(opts.inverted);
      const blur = Number.isFinite(opts.blur) ? opts.blur : 0;
      const alpha = Number.isFinite(opts.alpha) ? opts.alpha : 1;
      const now = Number.isFinite(opts.t) ? opts.t : 0;
      const onWhite = opts.onWhite === true;

      const dir = inverted ? -1 : 1;
      // Allow much larger flames in the preview (high magnification near focus).
      const H = clamp(Math.abs(height), 18, onWhite ? 1600 : 320);

      ctx.save();
      ctx.globalAlpha = alpha;

      if (blur > 0.001) {
        if ("filter" in ctx) {
          ctx.filter = `blur(${blur}px)`;
          drawFlame(x, baseY, height, { ...opts, blur: 0, alpha: 1, t: now });
          ctx.filter = "none";
          ctx.restore();
          return;
        }
      }

      // Small wick (optional visual anchor)
      const wickH = clamp(H * 0.12, 7, onWhite ? 60 : 18);
      const wickBaseY = baseY;
      const wickTipY = wickBaseY - dir * wickH;
      ctx.strokeStyle = onWhite ? "rgba(15,23,42,0.75)" : "rgba(226,232,240,0.55)";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x, wickBaseY);
      ctx.lineTo(x + (inverted ? -1 : 1) * 1.5, wickTipY);
      ctx.stroke();

      // Flame body: enforce that the visible tip is exactly at baseY - dir * H.
      const flick = Math.sin((now / 85) + x * 0.02) * 0.9 + Math.sin((now / 140) + 1.7) * 0.6;
      const tipY = baseY - dir * H;
      const fx = x + (inverted ? -1 : 1) * flick * 0.55;

      const wBase = clamp(H * 0.22 + flick * 0.18, 10, onWhite ? 520 : 52);
      const wMid = wBase * 0.56;
      const wTip = Math.max(1.5, wBase * 0.08);

      // Put the geometric base of the flame close to the wick tip.
      const yBase = wickTipY + dir * clamp(H * 0.02, 0, 4);
      const yMid = baseY - dir * (H * 0.55 + flick * 0.25);
      const yTip = tipY; // keep exact

      const outerGrad = ctx.createLinearGradient(0, Math.min(yTip, yBase), 0, Math.max(yTip, yBase));
      outerGrad.addColorStop(0, "rgba(255, 250, 230, 0.98)");
      outerGrad.addColorStop(0.35, cssVar("--flame2", "#fde047"));
      outerGrad.addColorStop(0.72, cssVar("--flame", "#f59e0b"));
      outerGrad.addColorStop(1, "rgba(245, 158, 11, 0.0)");
      ctx.fillStyle = outerGrad;

      if (onWhite) {
        ctx.save();
        ctx.shadowColor = "rgba(15, 23, 42, 0.14)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 2 * (inverted ? -1 : 1);
        ctx.beginPath();
        ctx.moveTo(fx, yTip);
        ctx.bezierCurveTo(fx - wTip, yTip + dir * (H * 0.10), fx - wMid, yMid - dir * (H * 0.12), fx - wBase, yBase);
        ctx.bezierCurveTo(fx - wBase * 0.62, yBase + dir * (H * 0.06), fx - wBase * 0.18, yBase + dir * (H * 0.08), fx, yBase + dir * (H * 0.08));
        ctx.bezierCurveTo(fx + wBase * 0.18, yBase + dir * (H * 0.08), fx + wBase * 0.62, yBase + dir * (H * 0.06), fx + wBase, yBase);
        ctx.bezierCurveTo(fx + wMid, yMid - dir * (H * 0.12), fx + wTip, yTip + dir * (H * 0.10), fx, yTip);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.moveTo(fx, yTip);
        ctx.bezierCurveTo(fx - wTip, yTip + dir * (H * 0.10), fx - wMid, yMid - dir * (H * 0.12), fx - wBase, yBase);
        ctx.bezierCurveTo(fx - wBase * 0.62, yBase + dir * (H * 0.06), fx - wBase * 0.18, yBase + dir * (H * 0.08), fx, yBase + dir * (H * 0.08));
        ctx.bezierCurveTo(fx + wBase * 0.18, yBase + dir * (H * 0.08), fx + wBase * 0.62, yBase + dir * (H * 0.06), fx + wBase, yBase);
        ctx.bezierCurveTo(fx + wMid, yMid - dir * (H * 0.12), fx + wTip, yTip + dir * (H * 0.10), fx, yTip);
        ctx.closePath();
        ctx.fill();
      }

      // Inner core (hot white/yellow)
      const coreW = wBase * 0.42;
      const coreH = H * 0.42;
      const coreY = yMid - dir * (H * 0.06);
      const coreGrad = ctx.createRadialGradient(fx, coreY, 1, fx, coreY, Math.max(coreH, coreW));
      coreGrad.addColorStop(0, "rgba(255, 255, 255, 0.90)");
      coreGrad.addColorStop(0.42, "rgba(255, 244, 202, 0.70)");
      coreGrad.addColorStop(0.95, "rgba(253, 224, 71, 0.10)");
      coreGrad.addColorStop(1, "rgba(253, 224, 71, 0.0)");
      ctx.save();
      ctx.globalAlpha = alpha * 0.95;
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.ellipse(fx, coreY, coreW, coreH, (inverted ? -1 : 1) * 0.06, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Tiny blue base near wick
      ctx.save();
      ctx.globalAlpha = alpha * 0.38;
      ctx.fillStyle = "rgba(59, 130, 246, 0.26)";
      ctx.beginPath();
      ctx.ellipse(x, wickTipY - dir * 3, wBase * 0.22, H * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    function drawScreen() {
      const x = state.screenX;
      const halfLen = 160;
      const top = state.screenY - halfLen;
      const bottom = state.screenY + halfLen;
      ctx.save();
      ctx.strokeStyle = cssVar("--screen", "#0f172a");
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x, bottom);
      ctx.stroke();
      ctx.restore();
    }

    function drawSceneCandle(now) {
      drawFlame(state.candleX, state.candleBaseY, state.candleHeight, { inverted: false, t: now });
    }

    function candleFlamePoint(baseY, height) {
      // Flame-only object: tip is baseY - height (upright).
      const H = clamp(Math.abs(height), 18, 320);
      return { x: state.candleX, y: baseY - H };
    }

    function candleBottomPoint(baseY, height) {
      // Flame-only object: bottom is its baseY (near wick).
      void height;
      return { x: state.candleX, y: baseY };
    }

    function flameTipOffsetFromBase(height, inverted) {
      const dir = inverted ? -1 : 1;
      const H = clamp(Math.abs(height), 18, 1600);
      return 0 - dir * H; // baseY is 0
    }

    function drawRays(doPx, image) {
      const xLens = state.lensX;
      const yAxis = state.axisY;
      const xObj = state.candleX;
      const yObjTop = candleFlamePoint(state.candleBaseY, state.candleHeight).y;

      // principal rays from top of object:
      // 1) parallel to axis -> converging: through right focus; diverging: diverges as if from left focus
      // 2) through center of lens -> straight line
      const fAbs = Math.max(1, Math.abs(state.fPx));
      const xFRight = xLens + fAbs;
      const xFLeft = xLens - fAbs;

      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";

      // ray 2: through lens center
      ctx.strokeStyle = cssVar("--ray2", "#a78bfa");
      ctx.beginPath();
      ctx.moveTo(xObj, yObjTop);
      ctx.lineTo(xLens, yAxis);
      // extend to right
      const t2 = (canvas.width - 24 - xLens) / (xLens - xObj);
      const yRight2 = yAxis + (yAxis - yObjTop) * t2;
      ctx.lineTo(canvas.width - 24, yRight2);
      ctx.stroke();

      // ray 1: parallel to axis to lens, then refract via focal point
      ctx.strokeStyle = cssVar("--ray", "#0ea5e9");
      ctx.beginPath();
      ctx.moveTo(xObj, yObjTop);
      ctx.lineTo(xLens, yObjTop);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(xLens, yObjTop);
      const xRight = canvas.width - 24;
      const dx = xRight - xLens;
      if (state.lensType === "diverging") {
        // Diverging lens: a parallel ray leaves diverging as if it originated from the left focal point.
        // Use the line through (xFLeft, yAxis) and the lens point (xLens, yObjTop), extended to the right.
        const slope = (yObjTop - yAxis) / ((xLens - xFLeft) || 1e-6);
        ctx.lineTo(xRight, yObjTop + slope * dx);
      } else {
        // Converging lens: a parallel ray refracts through the right focal point.
        const slope = (yAxis - yObjTop) / ((xFRight - xLens) || 1e-6);
        ctx.lineTo(xRight, yObjTop + slope * dx);
      }
      ctx.stroke();

      ctx.restore();
    }

    function drawHelperRays(imageSigned) {
      const xLens = state.lensX;
      const yAxis = state.axisY;
      const xObj = state.candleX;
      const yObjTop = candleFlamePoint(state.candleBaseY, state.candleHeight).y;
      const yObjBottom = candleBottomPoint(state.candleBaseY, state.candleHeight).y;

      // Lens vertical extent (matches drawLens()).
      const lensTop = 76;
      const lensBottom = canvas.height - 70;

      // Bundle of 5 rays leaving from one point (flame tip).
      // Distribute them around the optical axis so that (at least) two pass below the lens center.
      const offsets = [-72, -36, 0, 36, 72];
      const yLensPoints = offsets
        .map((d) => clamp(yAxis + d, lensTop + 12, lensBottom - 12));

      // Make the middle helper ray a "chief ray" through the optical center.
      // That ray should not bend in the thin-lens approximation.
      yLensPoints[2] = clamp(yAxis, lensTop + 12, lensBottom - 12);

      const xRight = canvas.width - 24;

      // Camera obscura: only a single ray can pass through the pinhole.
      if (state.lensType === "camera") {
        ctx.save();
        ctx.globalAlpha = 0.70;
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.setLineDash([7, 7]);
        function drawCameraBundle(yOrigin, strokeStyle) {
          ctx.strokeStyle = strokeStyle;
          for (let i = 0; i < yLensPoints.length; i += 1) {
            const yAtPlate = (i === 2) ? yAxis : yLensPoints[i];

            // Segment to the plate (always drawn)
            ctx.beginPath();
            ctx.moveTo(xObj, yOrigin);
            ctx.lineTo(xLens, yAtPlate);
            ctx.stroke();

            // Only the ray through the pinhole continues beyond the plate.
            if (i === 2) {
              const dxIn = xLens - xObj;
              const slope = (yAtPlate - yOrigin) / (dxIn || 1e-6);
              const dxOut = xRight - xLens;
              ctx.beginPath();
              ctx.moveTo(xLens, yAtPlate);
              ctx.lineTo(xRight, yAtPlate + slope * dxOut);
              ctx.stroke();
            } else {
              // Small "stop" mark on the plate to show absorption.
              ctx.save();
              ctx.setLineDash([]);
              ctx.globalAlpha = 0.55;
              ctx.lineWidth = 3.2;
              ctx.beginPath();
              ctx.moveTo(xLens - 1, yAtPlate - 4);
              ctx.lineTo(xLens - 1, yAtPlate + 4);
              ctx.stroke();
              ctx.restore();
            }
          }
        }

        // From flame tip and from flame base: 5 rays each, only the middle passes the hole.
        drawCameraBundle(yObjTop, "rgba(56, 189, 248, 0.95)");
        drawCameraBundle(yObjBottom, "rgba(34, 197, 94, 0.80)");

        ctx.setLineDash([]);
        ctx.restore();
        return;
      }

      // No-lens mode: helper rays are just straight lines (no refraction).
      if (state.lensType === "none") {
        ctx.save();
        ctx.globalAlpha = 0.62;
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.setLineDash([7, 7]);

        function drawBundleStraight(yOrigin, strokeStyle) {
          ctx.strokeStyle = strokeStyle;
          for (let i = 0; i < yLensPoints.length; i += 1) {
            const yAtRef = (i === 2) ? yAxis : yLensPoints[i];
            ctx.beginPath();
            ctx.moveTo(xObj, yOrigin);
            ctx.lineTo(xLens, yAtRef);
            const dxIn = xLens - xObj;
            const slope = (yAtRef - yOrigin) / (dxIn || 1e-6);
            const dxOut = xRight - xLens;
            ctx.lineTo(xRight, yAtRef + slope * dxOut);
            ctx.stroke();
          }
        }

        drawBundleStraight(yObjTop, "rgba(56, 189, 248, 0.92)");
        drawBundleStraight(yObjBottom, "rgba(34, 197, 94, 0.75)");

        ctx.setLineDash([]);
        ctx.restore();
        return;
      }

      const doPx = xLens - xObj;
      const fSigned = effectiveF();
      const fAbs = Math.abs(fSigned);

      // Thin-lens model for a point source:
      // - for real images (di > 0): all refracted rays pass through the image point
      // - for virtual images (di < 0): rays diverge as if they originated from the virtual image point
      // - at the focal position (di -> ±∞): outgoing rays become (approximately) parallel, smoothly.
      if (doPx <= 1e-6 || fAbs <= 1e-6) return;

      let di = null;
      let m = null;
      if (imageSigned?.type === "real" || imageSigned?.type === "virtual") {
        di = imageSigned.di;
        m = imageSigned.m;
      } else if (imageSigned?.type === "at_infinity") {
        // approximate infinity with a very far image plane
        di = (Math.sign(fSigned) || 1) * 1_000_000;
        m = -di / doPx;
      } else {
        return;
      }

      if (!Number.isFinite(di) || !Number.isFinite(m) || Math.abs(di) < 1e-6) return;

      ctx.save();
      ctx.globalAlpha = 0.62;
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.setLineDash([7, 7]);

      function drawBundle(yOrigin, strokeStyle) {
        // Image height from magnification (relative to axis)
        const yImg = yAxis + (yOrigin - yAxis) * m;
        ctx.strokeStyle = strokeStyle;

        for (let i = 0; i < yLensPoints.length; i += 1) {
          const yLens = yLensPoints[i];

          // Middle helper ray: single continuous chief ray through lens center.
          if (i === 2) {
            ctx.beginPath();
            ctx.moveTo(xObj, yOrigin);
            const dxIn = xLens - xObj;
            const slopeIn = (yAxis - yOrigin) / (dxIn || 1e-6);
            ctx.lineTo(xLens, yAxis);
            const dxOut = xRight - xLens;
            ctx.lineTo(xRight, yAxis + slopeIn * dxOut);
            ctx.stroke();
            continue;
          }

          // Incoming segment to lens
          ctx.beginPath();
          ctx.moveTo(xObj, yOrigin);
          ctx.lineTo(xLens, yLens);
          ctx.stroke();

          // Outgoing segment after lens
          ctx.beginPath();
          ctx.moveTo(xLens, yLens);
          const dx = xRight - xLens;
          const slope = (yImg - yLens) / di;
          ctx.lineTo(xRight, yLens + slope * dx);
          ctx.stroke();
        }
      }

      // From flame tip (existing)
      drawBundle(yObjTop, "rgba(56, 189, 248, 0.92)");
      // From bottom of the candle (new helper rays)
      drawBundle(yObjBottom, "rgba(34, 197, 94, 0.75)");

      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawImagePreview(image, focusedInfo) {
      // panel to the right of the screen, like "Obraz na stínítku"
      const panelW = 210;
      // Match preview "paper" height to the physical screen segment (2 * 160 px).
      // Inner white area has vertical padding 14px on both sides => screen.h = panelH - 28.
      const panelH = 348;
      // Fixed position on the canvas (does NOT follow the screen).
      const x0 = canvas.width - 24 - panelW;
      const y0 = 112;

      ctx.save();
      // Outer subtle frame (no labels)
      ctx.strokeStyle = "rgba(100,116,139,0.28)";
      ctx.lineWidth = 1.25;
      ctx.beginPath();
      roundRectPath(ctx, x0, y0, panelW, panelH, 12);
      ctx.stroke();

      // The "screen" (plátno) itself: fully white, no text/labels.
      const screen = {
        x: x0 + 14,
        y: y0 + 14,
        w: panelW - 28,
        h: panelH - 28
      };

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      roundRectPath(ctx, screen.x, screen.y, screen.w, screen.h, 10);
      ctx.fill();

      // Clip to the white screen so blur doesn't bleed out.
      ctx.save();
      ctx.beginPath();
      roundRectPath(ctx, screen.x, screen.y, screen.w, screen.h, 10);
      ctx.clip();

      const drawX = screen.x + screen.w / 2;
      const centerY = screen.y + screen.h / 2;

      // Map world Y on the physical screen segment to preview Y.
      // This makes the preview depend on vertical screen position (screenY).
      const halfLenWorld = 160; // must match drawScreen()
      const worldTop = state.screenY - halfLenWorld;
      const worldBottom = state.screenY + halfLenWorld;
      const worldToPreviewY = (yWorld) => screen.y + ((yWorld - worldTop) * screen.h) / (worldBottom - worldTop);
      const worldToPreviewScale = screen.h / (worldBottom - worldTop);

      // Make the image dimmer as the screen moves farther from the lens.
      // (Simple geometric falloff; tuned for visuals rather than strict photometry.)
      const screenDistPx = Math.max(0, state.screenX - state.lensX);
      const distNorm = screenDistPx / 420;
      const distanceAtten = clamp(1 / (1 + distNorm * distNorm), 0.06, 1);

      // Draw real image normally. For virtual image fade it out smoothly with heavy defocus.
      if ((image.type === "real" || image.type === "virtual") && focusedInfo.visible) {
        // Without a lens there is no imaging on a screen: show only a fully blurred glow.
        if (state.lensType === "none") {
          const flameWorldY = candleFlamePoint(state.candleBaseY, state.candleHeight).y;
          const flameY = worldToPreviewY(flameWorldY);

          ctx.save();
          if ("filter" in ctx) ctx.filter = "blur(32px)";
          ctx.globalAlpha = 0.45 * distanceAtten;
          const r = Math.max(screen.w, screen.h) * 0.55;
          const g = ctx.createRadialGradient(drawX, flameY, 2, drawX, flameY, r);
          g.addColorStop(0, "rgba(255, 244, 202, 0.65)");
          g.addColorStop(0.35, "rgba(253, 224, 71, 0.38)");
          g.addColorStop(0.8, "rgba(251, 191, 36, 0.10)");
          g.addColorStop(1, "rgba(251, 191, 36, 0.0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(drawX, flameY, r, r * 0.75, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.filter = "none";
          ctx.restore();

          ctx.restore(); // end clip
          ctx.restore();
          return;
        }

        const doPx = state.lensX - state.candleX;
        const fPx = state.fPx;

        // For a converging lens, once we go inside focal length the image is not projectable.
        // Keep the *same orientation* across the transition and let it blur/fade out (no sudden flip).
        const inverted = image.type === "real" || (image.type === "virtual" && state.lensType === "converging");
        const mAbs = typeof image.m === "number" ? Math.abs(image.m) : 0;
        const hPx = Math.max(8, (image.type === "real" ? focusedInfo.imageHeightPx : (state.candleHeight * mAbs)));

        let blurPx = 0;
        let alphaPx = 1;
        if (image.type === "real") {
          const defocus = Math.abs(focusedInfo.focusDeltaPx);
          blurPx = clamp(defocus * 0.06 + focusedInfo.blurPx * 0.6, 0, 22);
          alphaPx = clamp(1 - blurPx / 34, 0.55, 1);
        } else {
          // Virtual image:
          // - for converging lens (do < f): fade out smoothly as it "disappears"
          // - for diverging lens: show a very blurred warm-colored smear
          if (state.lensType === "diverging") {
            const defocus = Math.abs(focusedInfo.focusDeltaPx);
            blurPx = clamp(40 + defocus * 0.02, 40, 95);
            alphaPx = clamp(0.28, 0.18, 0.34);
          } else {
            const range = Math.max(18, fPx * 0.35);
            const t = clamp((fPx - doPx) / range, 0, 1); // 0 at f, 1 deeper inside
            // Right after crossing f, the image is not projectable -> must already be strongly blurred.
            blurPx = clamp(34 + t * 90, 34, 110);
            alphaPx = clamp(0.85 * (1 - t), 0, 0.85);
          }
        }

        // Camera obscura: image is sharp but very dim.
        if (state.lensType === "camera" && image.type === "real") {
          blurPx = 0;
          alphaPx = 0.16;
        }

        // Apply distance falloff for all modes (further screen => dimmer).
        alphaPx *= distanceAtten;

        // Always render the *image of the flame point* at its physical position on the screen.
        // This fixes cases where only a small part (or none) of the candle body is within the screen segment.
        if (image.type === "real" && typeof image.m === "number") {
          const flameWorldY = candleFlamePoint(state.candleBaseY, state.candleHeight).y;
          const flameImgWorldY = state.axisY + (flameWorldY - state.axisY) * image.m;
          const flameY = worldToPreviewY(flameImgWorldY);

          const spotBlur = blurPx * 1.35;
          const spotR = clamp(4 + spotBlur * 1.1, 4, 36);
          const spotAlpha = clamp(alphaPx * (focusedInfo.inFocus ? 0.95 : 0.75), state.lensType === "camera" ? 0.02 : 0.12, 1);

          ctx.save();
          if ("filter" in ctx && spotBlur > 0.001) ctx.filter = `blur(${spotBlur}px)`;
          ctx.globalAlpha = spotAlpha;
          const g = ctx.createRadialGradient(drawX, flameY, 1, drawX, flameY, spotR);
          g.addColorStop(0, "rgba(255, 244, 202, 0.98)");
          g.addColorStop(0.22, "rgba(253, 224, 71, 0.90)");
          g.addColorStop(0.55, "rgba(251, 191, 36, 0.55)");
          g.addColorStop(1, "rgba(251, 191, 36, 0.0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(drawX, flameY, spotR, spotR * 0.82, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.filter = "none";
          ctx.restore();
        }

        if (image.type === "virtual" && state.lensType === "diverging") {
          // Smear instead of a recognizable candle.
          const blobW = screen.w * 0.55;
          const blobH = screen.h * 0.42;
          const yCenterWorld = state.axisY + (candleFlamePoint(state.candleBaseY, state.candleHeight).y - state.axisY) * (typeof image.m === "number" ? image.m : 0);
          const blobCenterY = worldToPreviewY(yCenterWorld);
          ctx.save();
          if ("filter" in ctx) ctx.filter = `blur(${blurPx}px)`;
          ctx.globalAlpha = alphaPx;
          // warm radial blob (yellow core -> orange -> red)
          const g = ctx.createRadialGradient(drawX, blobCenterY, 2, drawX, blobCenterY, Math.max(blobW, blobH));
          g.addColorStop(0, "rgba(253, 224, 71, 0.95)");
          g.addColorStop(0.35, "rgba(251, 191, 36, 0.75)");
          g.addColorStop(0.72, "rgba(239, 68, 68, 0.45)");
          g.addColorStop(1, "rgba(239, 68, 68, 0.0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(drawX, blobCenterY, blobW / 2, blobH / 2, 0, 0, Math.PI * 2);
          ctx.fill();

          // a second, slightly offset yellow smear for "flame-like" feel
          const g2 = ctx.createRadialGradient(drawX, blobCenterY - blobH * 0.12, 1, drawX, blobCenterY - blobH * 0.12, Math.max(blobW, blobH) * 0.7);
          g2.addColorStop(0, "rgba(255, 244, 202, 0.85)");
          g2.addColorStop(0.55, "rgba(253, 224, 71, 0.40)");
          g2.addColorStop(1, "rgba(253, 224, 71, 0.0)");
          ctx.fillStyle = g2;
          ctx.beginPath();
          ctx.ellipse(drawX + blobW * 0.06, blobCenterY - blobH * 0.14, blobW * 0.22, blobH * 0.20, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.filter = "none";
          ctx.restore();

          ctx.restore(); // end clip
          ctx.restore();
          return;
        }

        // Project image position onto the screen segment in world coordinates.
        // This makes it possible that only part of the candle is visible (cropped by the screen bounds).
        const mVal = typeof image.m === "number" ? image.m : 0;
        const invertedDraw = mVal < 0 ? true : inverted;

        const hPxPreview = clamp(hPx * worldToPreviewScale, 12, 2200);
        const flameWorldY = candleFlamePoint(state.candleBaseY, state.candleHeight).y;
        const flameImgWorldY = state.axisY + (flameWorldY - state.axisY) * mVal;
        const flameTargetY = worldToPreviewY(flameImgWorldY);
        const tipOff = flameTipOffsetFromBase(hPxPreview, invertedDraw);
        const baseY = flameTargetY - tipOff;

        drawFlame(drawX, baseY, hPxPreview, {
          inverted: invertedDraw,
          blur: blurPx,
          alpha: alphaPx,
          t: performance.now(),
          onWhite: true
        });
      }

      ctx.restore(); // end clip
      ctx.restore();
    }

    function draw(now = performance.now()) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // geometry
      const xLens = state.lensX;
      const doPx = xLens - state.candleX;
      let imageSigned;
      if (state.lensType === "none") {
        imageSigned = { type: "real", di: Number.POSITIVE_INFINITY, m: 1 };
      } else if (state.lensType === "camera") {
        const di = state.screenX - xLens;
        const m = -di / Math.max(1e-6, doPx);
        imageSigned = { type: "real", di, m };
      } else {
        // Recompute with signed f for correct di sign behavior.
        imageSigned = computeImageSigned(doPx, effectiveF());
      }

      // focus + preview params
      const focus = {
        inFocus: false,
        focusDeltaPx: 0,
        blurPx: 0,
        visible: true,
        imageHeightPx: 0
      };

      if (imageSigned.type === "real") {
        if (state.lensType === "none") {
          focus.focusDeltaPx = 0;
          focus.inFocus = true;
          focus.blurPx = 0;
          focus.imageHeightPx = state.candleHeight;
          focus.visible = true;
        } else if (state.lensType === "camera") {
          // Pinhole camera has geometric imaging without defocus (in this simplified model).
          focus.focusDeltaPx = 0;
          focus.inFocus = true;
          focus.blurPx = 0;
          focus.imageHeightPx = state.candleHeight * Math.abs(imageSigned.m);
          focus.visible = true;
        } else {
          const xImgPlane = xLens + imageSigned.di;
          focus.focusDeltaPx = state.screenX - xImgPlane;
          const tol = 6; // px tolerance for "sharp"
          focus.inFocus = Math.abs(focus.focusDeltaPx) <= tol;
          focus.blurPx = clamp(Math.abs(focus.focusDeltaPx) * 0.10, 0, 14);
          focus.imageHeightPx = state.candleHeight * Math.abs(imageSigned.m);
          // Always render; the preview clamps size to fit the white screen.
          focus.visible = true;
        }
      } else if (imageSigned.type === "virtual") {
        // Use distance to the (virtual) image plane as a defocus proxy for preview effects.
        const xImgPlane = xLens + imageSigned.di; // di < 0 (left of lens)
        focus.focusDeltaPx = state.screenX - xImgPlane;
        focus.blurPx = clamp(Math.abs(focus.focusDeltaPx) * 0.10, 0, 20);
        focus.imageHeightPx = state.candleHeight * Math.abs(imageSigned.m);
      }

      // scene
      drawMarks();
      drawLens();
      drawScreen();
      drawSceneCandle(now);

      // rays
      if (state.showHelperRays) {
        drawHelperRays(imageSigned);
      }

      // preview panel next to the screen (as requested)
      drawImagePreview(imageSigned, focus);
    }

    function setCandleX(x) {
      // Prevent the flame from visually intersecting the lens.
      // This also avoids extreme geometry right at the lens plane.
      const minGapToLens = 64;
      const maxX = Math.max(limits.candleMin, state.lensX - minGapToLens);
      state.candleX = clamp(x, limits.candleMin, maxX);
      draw();
    }

    function setScreenX(x) {
      state.screenX = clamp(x, Math.max(limits.screenMin, state.lensX + 24), limits.screenMax);
      draw();
    }

    function setScreenY(y) {
      const halfLen = 160;
      state.screenY = clamp(y, 20 + halfLen, canvas.height - 20 - halfLen);
      draw();
    }

    function setScreenPos(x, y) {
      // clamp X first (needs lensX)
      state.screenX = clamp(x, Math.max(limits.screenMin, state.lensX + 24), limits.screenMax);
      const halfLen = 160;
      state.screenY = clamp(y, 20 + halfLen, canvas.height - 20 - halfLen);
      draw();
    }

    function setF(px) {
      state.fPx = clamp(px, 50, 220);
      draw();
    }

    // Signed lens formula variant (allows diverging lens f < 0).
    function computeImageSigned(doPx, fPxSigned) {
      if (doPx <= 0 || !Number.isFinite(fPxSigned) || fPxSigned === 0) return { type: "invalid" };
      const inv = (1 / fPxSigned) - (1 / doPx);
      if (Math.abs(inv) < 1e-9) return { type: "at_infinity" };
      const di = 1 / inv;
      const m = -di / doPx;
      return { type: di > 0 ? "real" : "virtual", di, m };
    }

    // dragging
    canvas.addEventListener("pointerdown", (event) => {
      const p = canvasPos(event);
      const c = candleHitRect();
      const s = screenHitRect();

      const inside = (r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

      if (inside(c)) {
        state.dragging = "candle";
        state.dragOffsetX = p.x - state.candleX;
        canvas.setPointerCapture?.(event.pointerId);
        return;
      }
      if (inside(s)) {
        state.dragging = "screen";
        state.dragOffsetX = p.x - state.screenX;
        state.dragOffsetY = p.y - state.screenY;
        canvas.setPointerCapture?.(event.pointerId);
        return;
      }
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!state.dragging) return;
      const p = canvasPos(event);
      if (state.dragging === "candle") {
        setCandleX(p.x - state.dragOffsetX);
      } else if (state.dragging === "screen") {
        setScreenPos(p.x - state.dragOffsetX, p.y - state.dragOffsetY);
      }
    });

    function endDrag() { state.dragging = null; }
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    if (convergingBtn) convergingBtn.addEventListener("click", () => setLensType("converging"));
    if (divergingBtn) divergingBtn.addEventListener("click", () => setLensType("diverging"));
    if (noLensBtn) noLensBtn.addEventListener("click", () => setLensType("none"));
    if (cameraBtn) cameraBtn.addEventListener("click", () => setLensType("camera"));
    if (helperRaysBtn) helperRaysBtn.addEventListener("click", () => {
      state.showHelperRays = !state.showHelperRays;
      helperRaysBtn.setAttribute("aria-pressed", String(state.showHelperRays));
      draw();
    });
    window.addEventListener("resize", positionLensToggle);

    // subtle flame flicker animation (cheap: just redraw)
    function animate(now) {
      draw(now);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
    positionLensToggle();
  </script>
</body>
</html>
